[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workweave"
version = "1.0.0"
description = "Multi-Agent Workflow & Task Coordination Dashboard"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "WorkWeave Contributors" }
]
keywords = ["workflow", "multi-agent", "dashboard", "coordination", "tasks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
workweave = "workweave.cli:main"

[tool.setuptools.packages.find]
include = ["workweave*"]

[tool.setuptools.package-data]
workweave = ["templates/*.html", "static/*.css", "static/*.js"]
